<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f0f7f0;">

<nav class="navbar bg-dark text-white p-3">
<div class="container">
<a href="index.html" class="text-white text-decoration-none"><h4>🌾 Admin Dashboard - Sarpanch</h4></a>
<a href="index.html" class="btn btn-light btn-sm">Back to Home</a>
</div>
</nav>

<div class="container mt-4">
<div class="row text-center">
<div class="col-md-4"><div class="card p-3 bg-primary text-white"><h3 id="total">0</h3><p>Total Complaints</p></div></div>
<div class="col-md-4"><div class="card p-3 bg-warning"><h3 id="pending">0</h3><p>Pending</p></div></div>
<div class="col-md-4"><div class="card p-3 bg-success text-white"><h3 id="resolved">0</h3><p>Resolved</p></div></div>
</div>

<div class="card p-3 mt-4">
<h4>All Complaints</h4>
<table class="table table-bordered mt-2">
<thead class="table-dark"><tr><th>ID</th><th>Name</th><th>Village</th><th>Type</th><th>Problem</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
<p id="emptyMsg" class="text-center text-muted">No complaints yet. File one from Home page.</p>
<button onclick="clearAll()" class="btn btn-danger btn-sm">Clear All Data</button>
</div>
</div>

<script>
function load(){
  let all = JSON.parse(localStorage.getItem('complaints') || '[]');
  document.getElementById('total').innerText = all.length;
  document.getElementById('pending').innerText = all.filter(c=>c.status!=='Resolved').length;
  document.getElementById('resolved').innerText = all.filter(c=>c.status==='Resolved').length;
  let body = document.getElementById('tableBody');
  body.innerHTML = '';
  document.getElementById('emptyMsg').style.display = all.length ? 'none' : 'block';
  all.forEach((c, i) => {
    let color = c.status==='Resolved' ? 'bg-success' : c.status==='In Progress' ? 'bg-primary' : 'bg-warning text-dark';
    body.innerHTML += `<tr><td>${c.id}</td><td>${c.name}</td><td>${c.village}</td><td>${c.type}</td><td>${c.desc}</td><td><span class="badge ${color}">${c.status}</span></td><td><select onchange="changeStatus(${i}, this.value)" class="form-select form-select-sm"><option>${c.status}</option><option>Pending</option><option>In Progress</option><option>Resolved</option></select></td></tr>`;
  });
}
function changeStatus(i, newStatus){
  let all = JSON.parse(localStorage.getItem('complaints') || '[]');
  all[i].status = newStatus;
  localStorage.setItem('complaints', JSON.stringify(all));
  load();
}
function clearAll(){
  if(confirm('Delete all complaints?')){ localStorage.removeItem('complaints'); load(); }
}
load();
</script>

</body>
</html>
